<!-- Plantilla del correo del reporte de planes TV.
     {{mensaje}} = texto de mensaje_tv.txt (o de --mensaje)
     {{firma}}   = firma configurada en TV_FIRMA (.env)
     Todo el CSS va inline porque Outlook ignora la mayoría de estilos en <style>. -->
<div style="font-family:Aptos,Calibri,Arial,sans-serif;font-size:11pt;color:#000000;">
{{mensaje}}
<br>
{{firma}}
</div>
